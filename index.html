<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AL-REHMAN PHOTOSTATE SAMARO</title>
<style>
:root{--b:#1a3a8f;--bd:#10266b;--g:#c9a227;--bg:#f3f5fb;--c:#fff;--t:#1b2233;--m:#6b7590;--l:#dde2ef;--r:#c0392b;--ok:#1e8e4e}
[data-t=dark]{--bg:#0f1424;--c:#182038;--t:#e9edf7;--m:#98a2bf;--l:#2a3556}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 "Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;background:var(--bg);color:var(--t)}
aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--bd);color:#fff;padding:12px;overflow:auto}
aside .logo{text-align:center;border-bottom:2px solid var(--g);padding-bottom:10px;margin-bottom:10px}
aside img{width:64px;height:64px;border-radius:50%;background:#fff}aside h1{margin:6px 0 0;font-size:20px;letter-spacing:1px}
aside h2{margin:0;font-size:12px;color:var(--g);font-weight:600}aside small{font-size:10px;opacity:.8}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cfd8f5;padding:10px 12px;border-radius:6px;font-size:14px;cursor:pointer}
nav button.on,nav button:hover{background:var(--b);color:#fff;box-shadow:inset 3px 0 var(--g)}
main{margin-left:220px;padding:20px;max-width:1200px}
.card{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--c);border:1px solid var(--l);border-top:3px solid var(--g);border-radius:6px;padding:12px}
.stat b{display:block;font-size:20px;color:var(--b)}[data-t=dark] .stat b{color:#8fb0ff}.stat span{color:var(--m);font-size:12px}
h3{margin:0 0 10px;color:var(--b)}[data-t=dark] h3{color:#8fb0ff}
input,select,textarea{font:inherit;padding:7px 8px;border:1px solid var(--l);border-radius:5px;background:var(--c);color:var(--t);max-width:100%}
input:focus,select:focus{outline:2px solid var(--g)}
label{font-size:12px;color:var(--m);display:block}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
button.btn{background:var(--b);color:#fff;border:0;padding:8px 14px;border-radius:5px;cursor:pointer;font:inherit}
button.gold{background:var(--g);color:#1b1500}button.red{background:var(--r)}button.sm{padding:3px 8px;font-size:12px}
button.gh{background:none;border:1px solid var(--l);color:var(--t)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}
th{background:var(--b);color:#fff;font-weight:600;font-size:13px}td.n,th.n{text-align:right}.neg{color:var(--r)}.pos{color:var(--ok)}
.line{display:grid;grid-template-columns:1.1fr 1.1fr 1.6fr .7fr .8fr .9fr auto;gap:6px;margin-bottom:6px}
.line input,.line select{width:100%}
#toast{position:fixed;right:16px;bottom:16px;z-index:9}#toast div{background:var(--bd);color:#fff;padding:10px 14px;border-left:4px solid var(--g);margin-top:6px;border-radius:4px}#toast .e{border-color:var(--r)}
canvas{width:100%;height:220px}
@media(max-width:800px){aside{position:static;width:auto}nav{display:flex;flex-wrap:wrap}nav button{width:auto}main{margin:0;padding:10px}.line{grid-template-columns:1fr 1fr}}
</style></head><body>

<nav id="nav"></nav><button class="btn gh sm" style="color:#fff;margin-top:10px" onclick="toggleTheme()">Light / Dark</button></aside>
<main id="m"></main><div id="toast"></div>

const num=v=>{v=parseFloat(v);return isFinite(v)?v:0},r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const fmt=n=>db.set.cur+" "+r2(n).toLocaleString("en-US",{maximumFractionDigits:2});
const ld=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>ld(new Date());
const toast=(t,e)=>{const d=document.createElement("div");d.textContent=t;if(e)d.className="e";$("toast").append(d);setTimeout(()=>d.remove(),3500)};
const bal=b=>r2(b.total-b.paid);
const cust=id=>db.customers.find(c=>c.id==id);
function cStats(c){const bs=db.bills.filter(b=>b.cid==c.id),ps=db.payments.filter(p=>p.cid==c.id);const work=r2(bs.reduce((s,b)=>s+b.total,0)),paid=r2(bs.reduce((s,b)=>s+b.paid,0)+ps.reduce((s,p)=>s+p.amt,0));return{bills:bs.length,work,paid,bal:r2(work-paid)}}
function range(k,a,b){const n=new Date(),t=today();let f=t,e=t;const sh=d=>{const x=new Date(n);x.setDate(x.getDate()+d);return ld(x)};
if(k=="yesterday")f=e=sh(-1);else if(k=="week")f=sh(-((n.getDay()+6)%7));else if(k=="month")f=t.slice(0,8)+"01";else if(k=="year")f=t.slice(0,4)+"-01-01";else if(k=="custom"){f=a||t;e=b||t}else if(k=="all"){f="0000";e="9999"}return[f,e]}
const inR=(d,[f,e])=>d>=f&&d<=e;
function totals(R){const bs=db.bills.filter(b=>inR(b.date,R)),ps=db.payments.filter(p=>inR(p.date,R)),ex=db.expenses.filter(x=>inR(x.date,R));
const sales=r2(bs.reduce((s,b)=>s+b.total,0)),cash=r2(bs.reduce((s,b)=>s+b.paid,0)+ps.reduce((s,p)=>s+p.amt,0)),exp=r2(ex.reduce((s,x)=>s+x.amt,0));
const svc={};Object.keys(db.services).forEach(k=>svc[k]=0);bs.forEach(b=>b.lines.forEach(l=>svc[l.cat]=r2((svc[l.cat]||0)+l.amt)));
const cs={};bs.forEach(b=>cs[b.name]=r2((cs[b.name]||0)+b.total));
const day={};bs.forEach(b=>day[b.date]=r2((day[b.date]||0)+b.total));
return{bs,ps,ex,sales,cash,exp,svc,cs,day,credit:r2(sales-bs.reduce((s,b)=>s+b.paid,0)),net:r2(sales-exp)}}
const outstanding=()=>r2(db.customers.reduce((s,c)=>s+Math.max(0,cStats(c).bal),0));
function chart(cv,labels,vals){const x=cv.getContext("2d"),W=cv.width=cv.clientWidth*2,H=cv.height=440;x.clearRect(0,0,W,H);
if(!vals.length||!Math.max(...vals)){x.fillStyle="#888";x.font="26px sans-serif";x.fillText("No data in this period",20,60);return}
const mx=Math.max(...vals),bw=W/vals.length;x.font="22px sans-serif";vals.forEach((v,i)=>{const h=(H-90)*v/mx;x.fillStyle=i%2?"#c9a227":"#1a3a8f";x.fillRect(i*bw+10,H-50-h,bw-20,h);x.fillStyle="#888";x.fillText(String(labels[i]).slice(0,10),i*bw+10,H-22);x.fillText(Math.round(v),i*bw+10,H-56-h)})}

const lines=d.lines.filter(l=>num(l.qty)||num(l.rate)||l.desc);if(!lines.length)return toast("Add at least one service",1);
for(const l of lines){if(!(num(l.qty)>0))return toast("Quantity must be greater than 0",1);if(l.rate!==""&&num(l.rate)<0)return toast("Rate cannot be negative",1)}
if(num(d.disc)<0||num(d.paid)<0)return toast("Discount/Paid cannot be negative",1);
const L=lines.map(l=>({cat:l.cat,sub:l.sub,desc:l.desc.trim(),qty:num(l.qty),rate:num(l.rate),amt:r2(num(l.qty)*num(l.rate))}));
const total=Math.max(0,r2(L.reduce((s,l)=>s+l.amt,0)-num(d.disc)));let paid=r2(num(d.paid));if(paid>total){if(!confirm("Paid is more than the total. Keep the extra as advance?"))return;}
st.sub=true;setTimeout(()=>st.sub=false,800);
let c=db.customers.find(c=>c.name.toLowerCase()==name.toLowerCase());
if(!c){c={id:uid("c"),name,phone:d.phone.trim(),addr:"",reg:today()};db.customers.push(c)}else if(d.phone.trim()&&!c.phone)c.phone=d.phone.trim();
if(paid>total){db.payments.push({id:uid("p"),cid:c.id,date:d.date,amt:r2(paid-total),note:"Advance with bill",type:"Advance"});paid=total}
L.forEach(l=>{if(l.sub)db.rates[l.cat+"|"+l.sub]=l.rate});
let bill;if(st.edit){bill=db.bills.find(b=>b.id==st.edit);Object.assign(bill,{date:d.date,cid:c.id,name:c.name,phone:c.phone,lines:L,disc:num(d.disc),total,paid})}
else{bill={id:uid("b"),no:db.seq++,date:d.date,cid:c.id,name:c.name,phone:c.phone,lines:L,disc:num(d.disc),total,paid};db.bills.push(bill)}
save();toast("Bill #"+bill.no+" saved");st.draft=null;st.edit=null;sessionStorage.removeItem("draft");if(pr)printBill(bill.id);go("bill")}
/* register */
V.reg=()=>{const R=range(st.dr,st.a,st.b);let bs=db.bills.filter(b=>inR(b.date,R));const q=st.q.toLowerCase(),f=st.f||"";
bs=bs.filter(b=>(!q||b.name.toLowerCase().includes(q)||String(b.no)==q||b.lines.some(l=>(l.desc+l.cat+l.sub).toLowerCase().includes(q)))&&(!f||(f=="paid"&&bal(b)<=0)||(f=="unpaid"&&b.paid==0&&b.total>0)||(f=="part"&&b.paid>0&&bal(b)>0)||(f.startsWith("c:")&&b.lines.some(l=>l.cat==f.slice(2))))).sort((a,b)=>b.no-a.no);
$("m").innerHTML=`<div class="card"><h3>Bill Register</h3>${dateBar()}<div class="row"><div><label>Search name / bill no / work</label><input id="q" value="${esc(st.q)}" oninput="st.q=this.value;clearTimeout(st.tm);st.tm=setTimeout(()=>{go('reg');$('q').focus();$('q').setSelectionRange(99,99)},250)"></div><div><label>Filter</label><select onchange="st.f=this.value;go('reg')"><option value="">All</option><option value="paid"${f=="paid"?" selected":""}>Paid</option><option value="unpaid"${f=="unpaid"?" selected":""}>Unpaid</option><option value="part"${f=="part"?" selected":""}>Partial</option>${Object.keys(db.services).map(c=>`<option value="c:${esc(c)}"${f=="c:"+c?" selected":""}>${esc(c)}</option>`).join("")}</select></div></div>
<div class="tw"><table><tr><th>Bill</th><th>Date</th><th>Customer</th><th>Service</th><th>Description</th><th class=n>Qty</th><th class=n>Rate</th><th class=n>Amount</th><th class=n>Paid</th><th class=n>Balance</th><th>Actions</th></tr>
${bs.map(b=>`<tr><td>${b.no}</td><td>${b.date}</td><td>${esc(b.name)}</td><td>${b.lines.map(l=>esc(l.cat)).join(", ")}</td><td>${esc(b.lines.map(l=>l.sub+(l.desc?" – "+l.desc:"")).join("; ")).slice(0,50)}</td><td class=n>${b.lines.reduce((s,l)=>s+l.qty,0)}</td><td class=n>${b.lines.length>1?"mixed":r2(b.lines[0].rate)}</td><td class=n>${fmt(b.total)}</td><td class=n>${fmt(b.paid)}</td><td class="n ${bal(b)>0?"neg":""}">${fmt(bal(b))}</td><td><button class="btn sm" onclick="printBill('${b.id}')">View/Print</button> <button class="btn sm gh" onclick="editBill('${b.id}')">Edit</button> <button class="btn sm red" onclick="delBill('${b.id}')">Delete</button></td></tr>`).join("")||`<tr><td colspan=11>No bills found for this period.</td></tr>`}</table></div>
<p><b>${bs.length}</b> bills · Total ${fmt(bs.reduce((s,b)=>s+b.total,0))} · Paid ${fmt(bs.reduce((s,b)=>s+b.paid,0))}</p></div>`};
function editBill(id){const b=db.bills.find(b=>b.id==id);st.edit=id;st.draft={cname:b.name,phone:b.phone||"",date:b.date,disc:b.disc||"",paid:b.paid||"",lines:b.lines.map(l=>({...l}))};go("bill")}
function delBill(id){const b=db.bills.find(b=>b.id==id);if(!confirm(`Delete bill #${b.no} for ${b.name}? This cannot be undone (export a backup first if unsure).`))return;db.bills=db.bills.filter(x=>x.id!=id);save();toast("Bill deleted");go("reg")}
/* invoice */

const small=size=="small",rows=b.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.cat)} ${esc(l.sub)}${l.desc?"<br><small>"+esc(l.desc)+"</small>":""}</td><td class=n>${l.qty}</td><td class=n>${r2(l.rate)}</td><td class=n>${r2(l.amt)}</td></tr>`).join("");
w.document.write(`<!DOCTYPE html><html><head><meta charset=utf-8><title>Bill ${b.no}</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:${small?"4px":"24px"};width:${small?"72mm":"auto"};font-size:${small?"11px":"14px"};color:#000}.h{text-align:center;border-bottom:3px double #1a3a8f;padding-bottom:6px}.h img{width:${small?45:70}px}.h h1{margin:2px;font-size:${small?16:30}px;color:#1a3a8f}.h h2{margin:0;font-size:${small?11:16}px}table{width:100%;border-collapse:collapse;margin:8px 0}th,td{border-bottom:1px solid #999;padding:4px;text-align:left}th{background:#1a3a8f;color:#fff}.n{text-align:right}.t{margin-left:auto;width:${small?"100%":"260px"}}.t div{display:flex;justify-content:space-between;padding:2px 0}.f{text-align:center;border-top:3px double #1a3a8f;margin-top:14px;padding-top:6px;font-size:${small?10:12}px}@media print{@page{size:${small?"80mm auto":"A4"};margin:5mm}}</style></head><body>
<div class=h><img src="${esc(s.logo||LOGO)}"><h1>${esc(s.name)}</h1><h2>Photocopy | Printing | Composing | Coating | Binding</h2><div>${esc(s.addr)}<br>${esc(s.phone)}</div></div>
<p><b>Bill #${b.no}</b> &nbsp; Date: ${b.date}<br>Customer: <b>${esc(b.name)}</b> ${esc(b.phone||c.phone||"")}</p>
<table><tr><th>#</th><th>Service</th><th class=n>Qty</th><th class=n>Rate</th><th class=n>Amount</th></tr>${rows}</table>

<div class=f>Thank You For Visiting Al-Rehman Photostate Samaro!</div><div style="text-align:center;margin-top:10px" class=np><button onclick="print()">Print</button> <button onclick="var s=document.createElement('style');s.textContent='@page{size:A4}';document.head.append(s);print()">Print A4</button> <small>(To save as PDF choose "Save as PDF" in the print dialog)</small></div><style>@media print{.np{display:none}}</style></body></html>`);w.document.close();if(small||size=="a4")setTimeout(()=>w.print(),400)}
/* customers */
V.cust=()=>{if(st.cid)return custPage();const q=st.q.toLowerCase();const cs=db.customers.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.phone||"").includes(q));
$("m").innerHTML=`<div class="card"><h3>Customers (${db.customers.length})</h3><div class="row"><div><label>Search</label><input value="${esc(st.q)}" oninput="st.q=this.value;clearTimeout(st.tm);st.tm=setTimeout(()=>{go('cust');document.querySelector('main input').focus();document.querySelector('main input').setSelectionRange(99,99)},250)"></div><button class="btn" onclick="addCust()">+ New Customer</button></div>
<div class="tw"><table><tr><th>Name</th><th>Phone</th><th>Registered</th><th class=n>Bills</th><th class=n>Total Work</th><th class=n>Paid</th><th class=n>Balance</th><th></th></tr>${cs.map(c=>{const s=cStats(c);return`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${c.reg}</td><td class=n>${s.bills}</td><td class=n>${fmt(s.work)}</td><td class=n>${fmt(s.paid)}</td><td class="n ${s.bal>0?"neg":"pos"}">${fmt(s.bal)}</td><td><button class="btn sm" onclick="go('cust',{cid:'${c.id}'})">Account</button> <button class="btn sm red" onclick="delCust('${c.id}')">Delete</button></td></tr>`}).join("")||"<tr><td colspan=8>No customers yet. They are added automatically when you save a bill.</td></tr>"}</table></div></div>`};
function addCust(){const n=(prompt("Customer name")||"").trim();if(!n)return;if(db.customers.some(c=>c.name.toLowerCase()==n.toLowerCase()))return toast("Customer already exists",1);db.customers.push({id:uid("c"),name:n,phone:prompt("Phone (optional)")||"",addr:"",reg:today()});save();go("cust")}
function delCust(id){const c=cust(id);if(db.bills.some(b=>b.cid==id)||db.payments.some(p=>p.cid==id))return toast("Customer has records and cannot be deleted",1);if(confirm("Delete "+c.name+"?")){db.customers=db.customers.filter(x=>x.id!=id);save();go("cust")}}
function custPage(){const c=cust(st.cid),s=cStats(c);const ev=[...db.bills.filter(b=>b.cid==c.id).map(b=>({d:b.date,t:"Bill #"+b.no,dr:b.total,cr:b.paid,id:b.id,k:"b"})),...db.payments.filter(p=>p.cid==c.id).map(p=>({d:p.date,t:p.type+(p.note?" – "+p.note:""),dr:0,cr:p.amt,id:p.id,k:"p"}))].sort((a,b)=>a.d.localeCompare(b.d));let run=0;
$("m").innerHTML=`<div class="card"><button class="btn gh sm" onclick="st.cid=null;go('cust')">← All customers</button><h3 style="margin-top:8px">${esc(c.name)} <small>${esc(c.phone)}</small></h3><div class="grid">${S("Total Work",fmt(s.work))}${S("Total Paid",fmt(s.paid))}${S("Remaining Balance",fmt(s.bal))}${S("Bills",s.bills)}</div></div>
<div class="card"><h3>Record payment</h3><div class="row"><div><label>Amount</label><input id="pa" type=number min=0 step=any></div><div><label>Type</label><select id="pt"><option>Cash</option><option>Partial Payment</option><option>Advance</option></select></div><div><label>Date</label><input id="pdt" type=date value="${today()}"></div><div><label>Note</label><input id="pn"></div><button class="btn gold" onclick="addPay('${c.id}')">Save Payment</button></div></div>
<div class="card"><h3>Statement</h3><div class="tw"><table><tr><th>Date</th><th>Details</th><th class=n>Billed</th><th class=n>Paid</th><th class=n>Balance</th><th></th></tr>${ev.map(e=>{run=r2(run+e.dr-e.cr);return`<tr><td>${e.d}</td><td>${esc(e.t)}</td><td class=n>${e.dr?fmt(e.dr):""}</td><td class=n>${e.cr?fmt(e.cr):""}</td><td class=n>${fmt(run)}</td><td>${e.k=="p"?`<button class="btn sm red" onclick="delPay('${e.id}')">Delete</button>`:`<button class="btn sm" onclick="printBill('${e.id}')">Bill</button>`}</td></tr>`}).join("")||"<tr><td colspan=6>No records yet.</td></tr>"}</table></div><button class="btn" onclick="printStatement('${c.id}')">Print Statement</button></div>`}
function addPay(cid){const a=num($("pa").value);if(!(a>0))return toast("Enter a payment amount above 0",1);db.payments.push({id:uid("p"),cid,date:$("pdt").value||today(),amt:r2(a),note:$("pn").value.trim(),type:$("pt").value});save();toast("Payment saved");go("cust")}
function delPay(id){if(confirm("Delete this payment?")){db.payments=db.payments.filter(p=>p.id!=id);save();go("cust")}}
function printStatement(cid){const c=cust(cid),s=cStats(c),w=window.open("","_blank");if(!w)return toast("Allow pop-ups",1);w.document.write(`<html><head><meta charset=utf-8><style>body{font-family:Arial;margin:24px}h1{color:#1a3a8f;margin:0}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #999;padding:4px;text-align:left}</style></head><body><h1>${esc(db.set.name)}</h1><p>${esc(db.set.addr)}</p><h3>Account Statement: ${esc(c.name)} (${today()})</h3><table><tr><th>Date</th><th>Details</th><th>Billed</th><th>Paid</th></tr>${[...db.bills.filter(b=>b.cid==cid).map(b=>[b.date,"Bill #"+b.no,b.total,b.paid]),...db.payments.filter(p=>p.cid==cid).map(p=>[p.date,p.type+" "+p.note,0,p.amt])].sort().map(e=>`<tr><td>${e[0]}</td><td>${esc(e[1])}</td><td>${e[2]||""}</td><td>${e[3]||""}</td></tr>`).join("")}</table><h3>Total work ${fmt(s.work)} · Paid ${fmt(s.paid)} · Remaining ${fmt(s.bal)}</h3><script>print()<\/script></body></html>`);w.document.close()}
/* reports */
V.rep=()=>{const R=range(st.dr,st.a,st.b),t=totals(R),top=Object.entries(t.cs).sort((a,b)=>b[1]-a[1]);const days=Object.keys(t.day).sort();

/* settings & backup */
async function dl(name,data,type){try{const d=await claude.use("downloads");if(!d)return toast("Downloads are not available here",1);await d.save({filename:name,data:new Blob([data],{type})})}catch(e){if(!e||e.code!="declined")toast("Could not save file",1)}}
function exportCSV(){const t=totals(range(st.dr,st.a,st.b));const rows=[["Bill","Date","Customer","Service","Sub","Description","Qty","Rate","Amount","Bill Total","Paid"]];t.bs.forEach(b=>b.lines.forEach(l=>rows.push([b.no,b.date,b.name,l.cat,l.sub,l.desc,l.qty,l.rate,l.amt,b.total,b.paid])));dl("bills-"+today()+".csv","\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv")}
function exportBackup(){db.backupDate=new Date().toISOString();save();dl("alrehman-backup-"+today()+".json",JSON.stringify(db,null,1),"application/json")}
function importBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.bills||!d.customers)throw 0;if(!confirm(`Replace ALL current data with this backup (made ${d.backupDate||"unknown date"}, ${d.bills.length} bills)? Current data will be lost.`))return;db=d;save();toast("Backup restored");go("dash")}catch(e){toast("Invalid backup file",1)}};r.readAsText(f)}
V.set=()=>{const s=db.set;$("m").innerHTML=`<div class="card"><h3>Shop details</h3><div class="row"><div><label>Shop name</label><input id="s1" value="${esc(s.name)}" style="width:280px"></div><div><label>Address</label><input id="s2" value="${esc(s.addr)}" style="width:320px"></div><div><label>Phone</label><input id="s3" value="${esc(s.phone)}" style="width:280px"></div><div><label>Currency</label><input id="s4" value="${esc(s.cur)}" style="width:70px"></div><div><label>Receipt size</label><select id="s5"><option value="a4"${s.size=="a4"?" selected":""}>A4</option><option value="small"${s.size=="small"?" selected":""}>Small (80mm)</option></select></div><div><label>Logo (optional)</label><input type=file accept="image/*" onchange="setLogo(this)"></div></div><button class="btn" onclick="saveSet()">Save Settings</button></div>
<div class="card"><h3>Services &amp; subcategories</h3>${Object.entries(db.services).map(([c,subs])=>`<p><b>${esc(c)}</b> <button class="btn sm gh" onclick="svc('addsub','${esc(c)}')">+ sub</button> <button class="btn sm gh" onclick="svc('ren','${esc(c)}')">Rename</button> <button class="btn sm red" onclick="svc('del','${esc(c)}')">Delete</button><br>${subs.map(x=>`${esc(x)} <a href="#" onclick="svc('delsub','${esc(c)}','${esc(x)}');return false" class="neg">✕</a>`).join(" · ")}</p>`).join("")}<button class="btn" onclick="svc('add')">+ New category</button><p style="color:var(--m)">Rates are never fixed: type any rate on each bill. The last rate used for a service is suggested automatically.</p></div>
<div class="card"><h3>Backup &amp; restore</h3><p><b>Important:</b> your data lives only in this browser on this computer. It does not sync to other computers or phones. Download a backup regularly and keep it safe (USB / email / Drive).</p><p>Last backup: ${db.backupDate?new Date(db.backupDate).toLocaleString():"never"}</p><div class="row"><button class="btn gold" onclick="exportBackup()">Export Full Backup (JSON)</button><div><label>Import Backup (JSON)</label><input type=file accept=".json" onchange="importBackup(this)"></div><button class="btn" onclick="st.dr='all';exportCSV()">Export All Bills (CSV, opens in Excel)</button></div></div>`};
function saveSet(){Object.assign(db.set,{name:$("s1").value.trim()||DEF.set.name,addr:$("s2").value,phone:$("s3").value,cur:$("s4").value||"Rs.",size:$("s5").value});save();toast("Settings saved");go("set")}
function setLogo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{db.set.logo=r.result;save();go("set")};r.readAsDataURL(f)}
function svc(a,c,x){const S=db.services;if(a=="add"){const n=(prompt("Category name")||"").trim().toUpperCase();if(n&&!S[n])S[n]=[]}
else if(a=="addsub"){const n=(prompt("Subcategory name")||"").trim();if(n&&!S[c].includes(n))S[c].push(n)}
else if(a=="delsub"){if(confirm("Remove "+x+"? Old bills keep their records."))S[c]=S[c].filter(y=>y!=x)}
else if(a=="ren"){const n=(prompt("New name",c)||"").trim().toUpperCase();if(n&&n!=c&&!S[n]){S[n]=S[c];delete S[c];db.bills.forEach(b=>b.lines.forEach(l=>{if(l.cat==c)l.cat=n}))}}
else if(a=="del"){if(db.bills.some(b=>b.lines.some(l=>l.cat==c)))return toast("Category is used in bills; rename instead",1);if(confirm("Delete "+c+"?"))delete S[c]}
save();go("set")}
function toggleTheme(){db.set.theme=db.set.theme=="dark"?"light":"dark";document.documentElement.dataset.t=db.set.theme;save()}
document.documentElement.dataset.t=db.set.theme;
try{const d=sessionStorage.getItem("draft");if(d)st.draft=JSON.parse(d)}catch(e){}
go("dash");
